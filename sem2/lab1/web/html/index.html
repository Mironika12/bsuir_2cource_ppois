<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Курсовой проект</title>

  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

<h1>Управление курсовым проектом</h1>

<div class="block">
  <h2>Вход</h2>

  <div class="field">
    <input id="studentId" placeholder="Номер студенческого билета">
    <small id="studentIdError" class="error-message"></small>
  </div>

  <div class="field">
    <input id="pin" type="password" placeholder="PIN">
    <small id="pinError" class="error-message"></small>
  </div>

  <button onclick="login()">Войти</button>
</div>

<div id="dashboard" style="display:none">

  <div class="block">
    <h2>Проект</h2>
    <div id="projectInfo"></div>
  </div>

  <div class="block">
    <h3>Выбрать тему</h3>

    <div class="field">
      <input id="themeInput" placeholder="Тема проекта">
      <small id="themeInputError" class="error-message"></small>
    </div>

    <button onclick="setTheme()">Сохранить тему</button>
  </div>

  <div class="block">
    <h3>Добавить пункт плана</h3>

    <div class="field">
      <input id="taskNum" type="number" placeholder="Номер">
      <small id="taskNumError" class="error-message"></small>
    </div>

    <div class="field">
      <input id="taskText" placeholder="Задача">
      <small id="taskTextError" class="error-message"></small>
    </div>

    <div class="field">
      <input id="taskDeadline" type="date">
      <small id="taskDeadlineError" class="error-message"></small>
    </div>

    <div class="field">
      <input id="taskNotes" placeholder="Заметки">
      <small id="taskNotesError" class="error-message"></small>
    </div>

    <button onclick="addPlanItem()">Добавить</button>
  </div>

  <div class="block">
    <h3>Добавить источник</h3>

    <div class="field">
      <input id="refInput" placeholder="Источник">
      <small id="refInputError" class="error-message"></small>
    </div>

    <button onclick="addReference()">Добавить</button>
  </div>

  <div class="block">
    <h3>Написать раздел</h3>

    <div class="field">
      <textarea id="sectionText"></textarea>
      <small id="sectionTextError" class="error-message"></small>
    </div>

    <button onclick="writeSection()">Сохранить</button>
  </div>

  <div class="block">
    <h3>Установить дедлайн</h3>

    <div class="field">
      <input id="deadlineDate" type="date">
      <small id="deadlineDateError" class="error-message"></small>
    </div>

    <button onclick="setDeadline()">Сохранить</button>
  </div>

  <div class="block">
    <h3>Добавить консультацию</h3>

    <div class="field">
      <input id="consultationDate" type="date">
      <small id="consultationDateError" class="error-message"></small>
    </div>

    <button onclick="addConsultation()">Добавить</button>
  </div>

  <div class="block">
    <button onclick="submitProject()">Отправить проект</button>
  </div>

</div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
